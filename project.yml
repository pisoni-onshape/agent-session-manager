name: AgentSessionManager
options:
  minimumXcodeGenVersion: 2.45.0
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.00000000
targets:
  AgentSessionManagerCore:
    type: library.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
        includes:
          - Adapters.swift
          - Models.swift
          - SessionFiltering.swift
          - SessionSearchCLI.swift
          - SessionSearchService.swift
          - SettingsModels.swift
          - Storage.swift
          - TranscriptDocumentCache.swift
          - Utilities.swift
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - sdk: libsqlite3.tbd
  AgentSessionManager:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
        includes:
          - AgentSessionManagerApp.swift
          - AppSettings.swift
          - CLIPathInstaller.swift
          - ContentView.swift
          - SettingsView.swift
          - ViewModel.swift
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pisoni.AgentSessionManager
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AgentSessionManagerCLI
        link: false
        embed: false
      - target: AgentSessionManagerCore
      - sdk: libsqlite3.tbd
    postBuildScripts:
      - name: Bundle CLI helper
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Helpers/AgentSessionManagerCLI
        script: |
          set -euo pipefail
          helper_source="${BUILT_PRODUCTS_DIR}/AgentSessionManagerCLI"
          helper_destination_dir="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Helpers"
          helper_destination="${helper_destination_dir}/AgentSessionManagerCLI"
          if [[ ! -x "$helper_source" ]]; then
            echo "Expected CLI helper at $helper_source" >&2
            exit 1
          fi
          mkdir -p "$helper_destination_dir"
          ditto "$helper_source" "$helper_destination"
          chmod +x "$helper_destination"
  AgentSessionManagerCLI:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/CLI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pisoni.AgentSessionManagerCLI
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - target: AgentSessionManagerCore
      - sdk: libsqlite3.tbd
  AgentSessionManagerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - target: AgentSessionManager
      - target: AgentSessionManagerCore
      - sdk: libsqlite3.tbd
